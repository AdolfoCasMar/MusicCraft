name: Desktop portability preview
on:
  push:
    branches: [desktop-cross-platform]
  workflow_dispatch:
concurrency:
  group: desktop-port-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb xdotool
      - name: Test
        run: cargo test --locked
      - name: Compile preview
        run: cargo build --release --locked
      - name: Check Linux application starts and opens a window
        if: runner.os == 'Linux'
        shell: bash
        run: |
          timeout 40s xvfb-run -a bash -c '
            export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
            ./target/release/musiccraft > /tmp/musiccraft.log 2>&1 & pid=$!
            for i in $(seq 1 25); do
              sleep 1
              if ! kill -0 "$pid" 2>/dev/null; then cat /tmp/musiccraft.log; exit 1; fi
              if xdotool search --name "MusicCraft" >/dev/null 2>&1; then kill "$pid"; wait "$pid" || true; exit 0; fi
            done
            cat /tmp/musiccraft.log; kill "$pid"; exit 1
          '
      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p MusicCraft.app/Contents/MacOS
          cp target/release/musiccraft MusicCraft.app/Contents/MacOS/MusicCraft
          cat > MusicCraft.app/Contents/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>CFBundleName</key><string>MusicCraft</string><key>CFBundleIdentifier</key><string>org.musiccraft.desktop</string><key>CFBundleExecutable</key><string>MusicCraft</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleShortVersionString</key><string>0.8.2</string><key>NSHighResolutionCapable</key><true/></dict></plist>
          EOF
          ditto -c -k --keepParent MusicCraft.app MusicCraft-macOS-preview.zip
      - name: Package Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p package-linux
          cp target/release/musiccraft package-linux/MusicCraft
          chmod 755 package-linux/MusicCraft
          printf '%s\n' 'MusicCraft Linux alpha (x86-64)' 'Requires GTK 3, WebKitGTK 4.1 and X11 or XWayland.' 'Experimental: network request filtering is not implemented on this platform. Playback, window docking and background behavior need further testing.' > package-linux/README.txt
          tar -czf MusicCraft-Linux-preview.tar.gz -C package-linux .
      - uses: actions/upload-artifact@v4
        with:
          name: MusicCraft-port-preview-${{ matrix.platform }}
          path: |
            target/release/musiccraft
            target/release/musiccraft.exe
            MusicCraft-macOS-preview.zip
            MusicCraft-Linux-preview.tar.gz
          if-no-files-found: error
  publish-alpha:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MusicCraft-port-preview-*
          path: artifacts
      - name: Publish clearly marked previews
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view desktop-v0.8.2-alpha.1 >/dev/null 2>&1; then
            echo 'Preview already published; leaving it unchanged.'
          else
            gh release create desktop-v0.8.2-alpha.1 artifacts/MusicCraft-port-preview-linux-x64/MusicCraft-Linux-preview.tar.gz artifacts/MusicCraft-port-preview-macos-arm64/MusicCraft-macOS-preview.zip --target "$GITHUB_SHA" --prerelease --title 'Linux and macOS — early test builds' --notes 'Early experimental builds, not feature-equivalent to Windows. Linux requires GTK 3, WebKitGTK 4.1 and X11 or XWayland. macOS build is unsigned. Network request filtering is not implemented on Linux or macOS, so advertisements may appear. Linux startup is smoke-tested; actual playback, docking, backgrounds, macOS runtime and hardware compatibility need testing.'
          fi
