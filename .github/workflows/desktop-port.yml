name: Desktop portability preview
on:
  push:
    branches: [desktop-cross-platform]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Test
        run: cargo test --locked
      - name: Compile preview
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: MusicCraft-port-preview-${{ matrix.platform }}
          path: |
            target/release/musiccraft
            target/release/musiccraft.exe
          if-no-files-found: error
