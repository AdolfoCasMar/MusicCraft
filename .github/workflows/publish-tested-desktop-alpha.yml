name: Publish tested desktop alpha
on:
  push:
    branches: [desktop-cross-platform]
    paths: ['.github/workflows/publish-tested-desktop-alpha.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the verified preview artifacts
        run: |
          gh run download 43088406099 --name MusicCraft-port-preview-linux-x64 --dir linux-build
          gh run download 43088406099 --name MusicCraft-port-preview-macos-arm64 --dir mac-build
          linux_binary=$(find linux-build -type f -name musiccraft -print -quit)
          mac_archive=$(find mac-build -type f -name MusicCraft-macOS-preview.zip -print -quit)
          test -n "$linux_binary" && test -n "$mac_archive"
          mkdir -p package-linux
          cp "$linux_binary" package-linux/MusicCraft
          chmod 755 package-linux/MusicCraft
          printf '%s\n' 'MusicCraft Linux alpha (x86-64)' 'Requires GTK 3, WebKitGTK 4.1 and X11 or XWayland.' 'Network request filtering is not implemented. Playback and window behavior need further tests.' > package-linux/README.txt
          tar -czf MusicCraft-Linux-preview.tar.gz -C package-linux .
          cp "$mac_archive" MusicCraft-macOS-preview.zip
          unzip -t MusicCraft-macOS-preview.zip >/dev/null
      - name: Publish early test builds
        run: |
          if gh release view desktop-v0.8.2-alpha.1 >/dev/null 2>&1; then
            echo 'Preview already published; leaving it unchanged.'
          else
            gh release create desktop-v0.8.2-alpha.1 MusicCraft-Linux-preview.tar.gz MusicCraft-macOS-preview.zip --target 5f99ad0c1d2e0bff5af8f0fb083f65771956ddfe --prerelease --title 'Linux and macOS — early test builds' --notes 'Early experimental builds, not feature-equivalent to Windows. Linux requires GTK 3, WebKitGTK 4.1 and X11 or XWayland. macOS ARM64 build is unsigned. Network request filtering is not implemented on Linux or macOS, so advertisements may appear. Linux startup is smoke-tested; actual playback, docking, backgrounds, macOS runtime and hardware compatibility need testing.'
          fi

